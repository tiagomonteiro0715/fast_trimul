[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fast_trimul"
version = "3.0.3"
description = "Fused Triangle Multiplicative Update (AlphaFold/OpenFold) on CUTLASS CuTe DSL kernels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tiago Monteiro" }]
keywords = ["alphafold", "openfold", "triangle-multiplication", "cutlass", "cute", "gpu-kernel"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "nvidia-cutlass-dsl",
    "cuda-python<13",   # 13.x needs a CUDA 13 driver; most GPUs/Studios are still CUDA 12.x
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/tiagomonteiro0715/fast_trimul"
Repository = "https://github.com/tiagomonteiro0715/fast_trimul"
Issues = "https://github.com/tiagomonteiro0715/fast_trimul/issues"

[tool.hatch.build.targets.wheel]
packages = ["fast_trimul"]

[tool.pytest.ini_options]
markers = ["gpu: requires a CUDA device"]

[tool.ruff]
# Lint the core library + tests. Excluded: the hand-written / NVIDIA-derived CuTe
# DSL kernels and the benchmark harness (ruff can't resolve the DSL / timing-lambda
# closures -> false positives), and the notebook-style example/report scripts.
extend-exclude = [
    "fast_trimul/_kernels.py",
    "fast_trimul/_tensorop_gemm.py",
    "fast_trimul/benchmark.py",
    "reports",
    "examples",
]

[tool.ruff.lint]
# Basic-correctness lint only (pyflakes + real pycodestyle errors), made explicit so
# every ruff version agrees. We intentionally do NOT enable the opinionated sets
# (I / UP / S / BLE / PLR / RUF): several flag deliberate patterns, e.g. the broad
# try/except around the optional CUDA backend import that preserves the torch fallback.
select = ["E4", "E7", "E9", "F"]
