[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fast_trimul"
version = "2.4.0"
description = "Fused Triangle Multiplicative Update (AlphaFold/OpenFold) on CUTLASS CuTe DSL kernels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tiago Monteiro" }]
keywords = ["alphafold", "openfold", "triangle-multiplication", "cutlass", "cute", "gpu-kernel"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "nvidia-cutlass-dsl",
    "cuda-python<13",   # 13.x needs a CUDA 13 driver; most GPUs/Studios are still CUDA 12.x
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/tiagomonteiro0715/fast_trimul"
Repository = "https://github.com/tiagomonteiro0715/fast_trimul"
Issues = "https://github.com/tiagomonteiro0715/fast_trimul/issues"

[tool.hatch.build.targets.wheel]
packages = ["fast_trimul"]
